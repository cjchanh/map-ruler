[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "map-ruler"
version = "0.6.0"
description = "Roof, fence, and driveway measurements from OpenStreetMap with a documented scale chain and sealed JSON records"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Centennial Defense Systems / map-ruler contributors" }]
keywords = ["gis", "measure", "osm", "scale", "cds"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7", "Pillow>=10.0"]
dev = ["matplotlib>=3.7", "Pillow>=10.0"]

[project.scripts]
map-ruler = "map_ruler.cli:main"

[tool.setuptools.packages.find]
include = ["map_ruler*"]

[project.urls]
Homepage = "https://github.com/cjchanh/map-ruler"

[tool.pytest.ini_options]
# Without this, `pytest` (the console script) cannot import this repo's own
# packages: it does not put the rootdir on sys.path, so the suite reads red for
# a path reason and not a code reason. `python -m pytest` masked it by adding CWD.
pythonpath = ["."]
